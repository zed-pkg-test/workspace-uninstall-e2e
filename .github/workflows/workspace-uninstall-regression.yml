name: DEN-2038 workspace uninstall regression

on:
  pull_request:
    paths:
      - '.github/workflows/workspace-uninstall-regression.yml'
      - 'source-pins.json'
      - 'test-plan.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/workspace-uninstall-regression.yml'
      - 'source-pins.json'
      - 'test-plan.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-uninstall-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_COMMIT: 5d1d13119be5784f545a7d812cdfaae3ca120693
  ZED_INTERFACES_COMMIT: d1bf8ef7c88a75292cbe8d697bfd269f30d62e2b
  ZED_LOCK_COMMIT: a0dc78d385bc3ab553d3027b427f5f1428239c9c
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  certify:
    name: ${{ matrix.os }} workspace uninstall
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Require immutable source pins
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZED_CLI_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_INTERFACES_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ZED_LOCK_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out test contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: contract
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Check out exact zed-cli candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_COMMIT }}
          path: zed-cli
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install stable Rust validation toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy

      - name: Verify exact candidate dependency graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zed-cli rev-parse HEAD)" = "$ZED_CLI_COMMIT"
          grep -Fq "rev = \"$ZED_INTERFACES_COMMIT\"" zed-cli/Cargo.toml
          grep -Fq "rev = \"$ZED_LOCK_COMMIT\"" zed-cli/Cargo.toml
          jq -e --arg sha "$ZED_CLI_COMMIT" '.sources["zed-pkg/zed-cli"].sha == $sha' contract/source-pins.json
          jq -e --arg sha "$ZED_CLI_COMMIT" '.sources[] | select(.fullName == "zed-pkg/zed-cli") | .sha == $sha' contract/test-plan.json

      - name: Enumerate required test families
        shell: bash
        run: |
          set -euo pipefail
          listing="$(mktemp)"
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib -- --list | tee "$listing"
          workspace_count="$(grep -Eic 'workspace' "$listing")"
          uninstall_count="$(grep -Eic 'uninstall' "$listing")"
          project_lock_count="$(grep -Eic 'project_lock|operation_lock' "$listing")"
          test "$workspace_count" -gt 0
          test "$uninstall_count" -gt 0
          test "$project_lock_count" -gt 0
          {
            echo '## Enumerated regression families'
            echo
            echo "- workspace tests: $workspace_count"
            echo "- uninstall tests: $uninstall_count"
            echo "- checkout-lock tests: $project_lock_count"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Run workspace graph tests
        shell: bash
        run: cargo test --locked --manifest-path zed-cli/Cargo.toml --lib workspace -- --nocapture

      - name: Run uninstall and frozen-restoration tests
        shell: bash
        run: cargo test --locked --manifest-path zed-cli/Cargo.toml --lib uninstall -- --nocapture

      - name: Run checkout-local operation-lock tests
        shell: bash
        run: cargo test --locked --manifest-path zed-cli/Cargo.toml --lib project_lock -- --nocapture

      - name: Run store process-lock release tests
        shell: bash
        run: |
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib \
            store::tests::install_process_lock_blocks_without_polling_until_owner_release \
            -- --exact --nocapture
          cargo test --locked --manifest-path zed-cli/Cargo.toml --lib \
            store::tests::install_process_lock_is_released_when_owner_process_is_terminated \
            -- --exact --nocapture

      - name: Check formatting and strict Clippy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --manifest-path zed-cli/Cargo.toml -- --check
          cargo clippy --locked --manifest-path zed-cli/Cargo.toml --lib --bin zed -- -D warnings

      - name: Build exact release executable
        shell: bash
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml --bin zed

      - name: Prove source checkouts remained clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for repository in contract zed-cli; do
            status="$(git -C "$repository" status --porcelain=v1 --untracked-files=all)"
            if [[ -n "$status" ]]; then
              printf 'dirty %s checkout:\n%s\n' "$repository" "$status" >&2
            fi
            test -z "$status"
          done
